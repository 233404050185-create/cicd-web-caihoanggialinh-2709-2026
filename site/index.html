
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Demo - Version 2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #263b63);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      padding: 48px 32px;
      border: 1px solid #6479a8;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #174d3c;
      color: #8df2c5;
      font-size: 13px;
      font-weight: bold;
    }
    h1 { font-size: clamp(30px, 6vw, 48px); margin: 22px 0 14px; }
    p { color: #d4dced; line-height: 1.8; }
    .version {
      margin: 28px 0 12px;
      font-size: 24px;
      font-weight: bold;
      color: #93c5fd;
    }
    footer { margin-top: 32px; color: #aab8d0; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">AWS S3 · GITHUB ACTIONS</span>
    <h1>My CI/CD Demo Website</h1>
    <p>
      Website được triển khai tự động bằng GitHub Actions
      lên Amazon S3 Static Website Hosting.
    </p>
   <div class="version">VERSION 2</div>
    <p>Source Code → GitHub Actions → Amazon S3</p>
    <footer>Lab 10 · Continuous Integration & Continuous Deployment</footer>
  </main>
</body>
</html>
